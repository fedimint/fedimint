[package]
authors = { workspace = true }
description = "Bitcoin Core connectivity used by Fedimint"
edition = { workspace = true }
license = { workspace = true }
name = "fedimint-bitcoind"
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
rustc-args = ["--cfg", "tokio_unstable"]

[features]
bitcoincore = ["bitcoincore-rpc"]
default = []

[lib]
name = "fedimint_bitcoind"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
bitcoin = { workspace = true }
bitcoincore-rpc = { workspace = true, optional = true }
fedimint-core = { workspace = true }
fedimint-logging = { workspace = true }
fedimint-metrics = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
esplora-client = { workspace = true }

# 0.13's bitreq transport requires native sockets. Keep the reqwest-based
# client on WASM until esplora-client supports browser networking again.
[target.'cfg(target_family = "wasm")'.dependencies]
esplora-client = { version = "0.12.3", default-features = false, features = [
    "async-https-rustls",
    "async",
    "tokio",
] }

[lints]
workspace = true
