# Shared cargo-crap defaults for local runs and CI gates.
# CLI arguments take precedence over this file.
default-excludes = ["benches/**", "examples/**", "tests/**"]
missing = "pessimistic"
sort = "crap"
# The fifth-highest score before removing the exception baseline was 2862.
# All five highest functions were refactored; equality is allowed by the gate.
# Keep a single ceiling rather than a per-function list of accepted regressions.
threshold = 2862
