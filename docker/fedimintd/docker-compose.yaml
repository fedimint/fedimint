services:
  fedimintd:
    image: fedimint/fedimintd:v0.11.2
    ports:
      - 8173:8173/tcp # p2p tls
      - 8173:8173/udp # p2p iroh
      - 8174:8174/udp # api iroh
      - 127.0.0.1:8175:8175/tcp # ui
    volumes:
      - fedimintd_data:/data
    environment:
      - FM_ENABLE_IROH=true
      - FM_BITCOIN_NETWORK=bitcoin
      - FM_ESPLORA_URL=https://mempool.space/api
      # To use your own bitcoind, remove FM_ESPLORA_URL and uncomment below.
      # This sample's pinned image predates the sync-aware hybrid routing fixes;
      # use one backend unless upgrading to a release containing those fixes.
      # Hybrid mode trusts Esplora for chain selection. Broadcast is always
      # bitcoind-first, with Esplora attempted only after a primary error,
      # NOT simultaneous. See SECURITY.md before configuring a trusted fallback.
      # - FM_BITCOIND_URL=http://bitcoind:8332
      # - FM_BITCOIND_USERNAME=bitcoin
      # - FM_BITCOIND_PASSWORD=bitcoin
      - FM_BIND_P2P=0.0.0.0:8173
      - FM_BIND_API=0.0.0.0:8174
      - FM_BIND_UI=0.0.0.0:8175
    restart: always

  # Uncomment to run your own bitcoind alongside fedimintd.
  # bitcoind:
  #   image: bitcoind/bitcoin:28.1
  #   volumes:
  #     - bitcoind_data:/home/bitcoin/.bitcoin
  #   environment:
  #     BITCOIN_DATA: /home/bitcoin/.bitcoin
  #   command:
  #     - -server=1
  #     - -rpcuser=bitcoin
  #     - -rpcpassword=bitcoin
  #     - -rpcallowip=0.0.0.0/0
  #     - -rpcbind=0.0.0.0
  #   restart: always

volumes:
  fedimintd_data:
  # bitcoind_data:
