name: 'check reminders'

on:
  schedule:
    # Run every hour at the 10th minute
    - cron: '10 * * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  reminder:
    runs-on: ubuntu-latest

    steps:
      - name: check reminders and notify
        uses: agrc/reminder-action@5563aa33846cae8d91b7e82a3c41f989e5d060b2 # v1.0.23
