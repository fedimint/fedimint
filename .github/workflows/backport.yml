name: Backport merged pull request
on:
  # Backports need write access even when the merged PR came from a fork.
  # Keep this exception local to merged PRs with a backport target below.
  pull_request_target:
    # Run on merge (close) or if label is added after merging
    types: [closed, labeled]
permissions: {}
jobs:
  backport:
    permissions:
      contents: write # so it can comment
      pull-requests: write # so it can create pull requests
    name: Backport pull request
    runs-on: [self-hosted, linux, x64]
    if: >-
      github.repository == 'fedimint/fedimint' &&
      github.event.pull_request.merged &&
      ((github.event.action == 'closed' &&
        contains(toJSON(github.event.pull_request.labels.*.name), '"backport ')) ||
       (github.event.action == 'labeled' &&
        startsWith(github.event.label.name, 'backport ')))
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.number }}
      cancel-in-progress: false
    # The action can report failed targets without failing the job.
    outputs:
      was_successful: ${{ steps.create-pr.outputs.was_successful }}
      was_successful_by_target: ${{ steps.create-pr.outputs.was_successful_by_target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check out the base branch (no fork code) so the fork-PR guard under pull_request_target passes
          ref: ${{ github.base_ref }}
      - id: create-pr
        name: Create backport pull requests
        uses: korthout/backport-action@ad272ff24e4a8593bf18a951a154ae6af93b26b8 # v5.0.0
        with:
          github_token: ${{ secrets.BACKPORT_TOKEN }}
  notifications:
    name: Notify Discord of failed backports
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 1
    needs: backport
    if: >-
      !cancelled() && github.repository == 'fedimint/fedimint' &&
      (needs.backport.result == 'failure' || needs.backport.outputs.was_successful == 'false')
    steps:
      - name: Send backport failure to Discord
        uses: sarisia/actions-status-discord@74e2ad0c4e57ca8b9ba6aee75d5a7841497bbb87 # v1.16.1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          nofail: false
          title: Backport failed
          content: >-
            Backport failed for ${{ github.repository }}#${{ github.event.number }}
            (<${{ github.event.pull_request.html_url }}>).
            Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}>.
          description: |
            Target results (`false` means the backport failed):
            ${{ needs.backport.outputs.was_successful_by_target || 'Unavailable. See the workflow run for details.' }}
  open-issue:
    permissions:
      contents: read
      issues: write
    name: Open issue for failed backports
    runs-on: [self-hosted, linux, x64]
    needs: backport
    # Open an issue when the action reports failed targets.
    if: ${{ needs.backport.outputs.was_successful == 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check out the base branch (no fork code) so the fork-PR guard under pull_request_target passes
          ref: ${{ github.base_ref }}
      - name: Set SHORT_PR_TITLE env
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # logic to truncate titles needs to be run in a previous step
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#setting-an-environment-variable
          SHORT_PR_TITLE=$(
            printf '%s' "$PR_TITLE" \
            | tr '\r\n' '  ' \
            | awk '{print (length($0) > 40) ? substr($0, 1, 40) "..." : $0}'
          )
          printf 'SHORT_PR_TITLE=%s\n' "$SHORT_PR_TITLE" >> "$GITHUB_ENV"
      - name: Create issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SHORT_PR_TITLE: ${{ env.SHORT_PR_TITLE }}
        with:
          filename: .github/templates/failed-backport-issue.md
